<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    />

    <title>Profile Card</title>
  </head>

  <body>
    <div class="card">
      <div class="cover">
        <img src="cover.png" alt="Cover" />

        <div class="save">
          <i class="fa-regular fa-bookmark" style="color: rgb(0, 0, 0)"></i>
        </div>

        <div class="logo">
          <img src="logo.png" alt="Profile" />
        </div>
      </div>

      <div class="name">
        <div class="info">
          <h2>Abishek Adhikari</h2>
          <p>UI/UX Designer</p>
        </div>

        <div class="tools">
          <div class="logo1"></div>
          <div class="logo2">
            <img
              src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTx9UJ5fxWHEDgLx-gh5IlztvYDUvFQToSe63EDTdw8Kg&s=10"
              alt="logo"
            />
          </div>
          <button>Tools</button>
        </div>
      </div>


      <div class="bottom">
        <div class="star">
          <h3>
            <i class="fa-solid fa-star" style="color: rgb(0, 0, 0)"> </i> 4.8
          </h3>
          <p>Rating</p>
        </div>

        <div class="star">
          <h3>4 Years</h3>
          <p>Duration</p>
        </div>

        <div class="stars">
          <h3>$50/hr</h3>
          <p>Rate</p>
        </div>

        <button class="contact">Get in touch</button>
      </div>
    </div>
  </body>
</html>
